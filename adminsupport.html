<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyCcpG-oEqkDprgTwWXKt5CFsttjAQAZFNg",
authDomain:"bookstore-6ab08.firebaseapp.com",
databaseURL:"https://bookstore-6ab08-default-rtdb.firebaseio.com",
projectId:"bookstore-6ab08"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* 🔐 PAGE PROTECTION */
onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    const ADMIN_UIDS = [
        "F9UxJ3W6CVUVIIgwByuHQxscQab2",

    ];
if (!ADMIN_UIDS.includes(user.uid)) {

}
    // Automatically open tickets page
    hideAllSections();

});
window.submitTicket = async function(){

const nameInput = document.getElementById("nameInput");
const issueInput = document.getElementById("issueType");
const descInput = document.getElementById("description");

const name = nameInput.value.trim();
const issue = issueInput.value;
const desc = descInput.value.trim();
const email = document.getElementById("userEmail").value;

let valid = true;

/* RESET */
document.querySelectorAll(".error-text").forEach(e => e.innerText = "");
[nameInput, issueInput, descInput].forEach(el => {
    el.classList.remove("error");
});

/* NAME */
if(!name){
    nameInput.classList.add("error");
    document.getElementById("nameError").innerText = "This field is required";
    nameInput.focus();
    valid = false;
}

/* ISSUE */
if(issue === "Choose..."){
    issueInput.classList.add("error");
    document.getElementById("issueError").innerText = "This field is required";
    valid = false;
}

/* DESCRIPTION */
if(!desc){
    descInput.classList.add("error");
    document.getElementById("descError").innerText = "This field is required";
    valid = false;
}

if(!valid) return;

try{

// 🔥 UNIQUE TICKET ID (6 digit)
const ticketId = Math.floor(100000 + Math.random()*900000);

// 🔥 USER UID PATH
const user = auth.currentUser;
if(!user){
alert("User not logged in");
return;
}
const uid = user.uid;

await set(ref(db, `tickets/${uid}/${ticketId}`), {
ticketId,
createdAt: Date.now(),
email,
name,
issue: issue.toLowerCase().replace(/[^a-z0-9]+/g,"_"),
description: desc,
files: await Promise.all(selectedFiles.map(file => {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
            resolve({
                name: file.name,
                type: file.type,
                url: reader.result   // 🔥 actual file data
            });
        };
        reader.readAsDataURL(file);
    });
}))
});


// 🔄 refresh
location.reload();

}catch(err){
alert("Error saving ticket");
console.error(err);
}

}
window.openTickets = async function(){
hideAllSections();
document.getElementById("ticketsSection").style.display="block";

const user = auth.currentUser;
if(!user) return;

const uid = user.uid;

const ticketsRef = ref(db, `tickets`);
const snapshot = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js")
.then(m => m.get(ticketsRef));

let tickets = [];

if(snapshot.exists()){
    const data = snapshot.val();
    tickets = [];

Object.entries(data).forEach(([userUid, userTickets]) => {

    Object.values(userTickets).forEach(ticket => {

        ticket.ownerUid = userUid;

        tickets.push(ticket);

    });

});
}

/* DEFAULT SORT */
tickets.sort((a,b)=>b.createdAt - a.createdAt);

renderTickets(tickets);

/* FILTER HANDLERS */
document.getElementById("statusFilter").onchange = () => renderTickets(tickets);
document.getElementById("sortFilter").onchange = () => renderTickets(tickets);

function renderTickets(data){

let filtered = [...data];

const statusVal = document.getElementById("statusFilter").value;
const sortVal = document.getElementById("sortFilter").value;

/* FILTER */
if(statusVal !== "all"){
    filtered = filtered.filter(t => {
        const s = t.status || "open";
        return s === statusVal;
    });
}

/* SORT */
if(sortVal === "new"){
    filtered.sort((a,b)=>b.createdAt - a.createdAt);
}else{
    filtered.sort((a,b)=>a.createdAt - b.createdAt);
}

const container = document.getElementById("ticketList");
container.innerHTML = "";
document.getElementById("ticketCount").innerText =
`${filtered.length} Tickets`;
filtered.forEach(t => {

const date = new Date(t.createdAt).toLocaleString();

const statusClass = t.status === "resolved" ? "status-resolved" : "status-open";
const statusText = t.status === "resolved" ? "Resolved" : "Open";

container.innerHTML += `
<div onclick="openTicketDetail('${t.ownerUid}', ${t.ticketId})" class="ticket-item">

<div>
<div style="color:#1976d2;font-weight:600;">
#${t.ticketId}
</div>

<div style="font-size:14px;font-weight:500;">
${t.name || "Unknown User"}
</div>

<div style="font-size:12px;color:#666;">
${t.email || ""}
</div>

<div style="font-size:12px;color:#888;">
Created on ${date}
</div>
</div>

}
};

window.submitReply = async function(ownerUid, ticketId){

const input = document.getElementById("replyInput");
const text = input.value.trim();

if(!text){
    alert("Write something");
    return;
}

const resolved =
document.getElementById("resolveCheckbox").checked;

const { update } = await import(
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
);

await update(
ref(db, `tickets/${ownerUid}/${ticketId}`),
{
    admin_reply: text,
    admin_reply_time: Date.now(),
    status: resolved ? "resolved" : "open"
}
);


openTicketDetail(ownerUid, ticketId);

};

<script>
function hideAllSections(){
    document.getElementById("ticketsSection").style.display = "none";
    document.getElementById("ticketDetailSection").style.display = "none";
}
function goTo(path){
    window.location.hash = path;
}
function handleRoute() {}
/* RUN ON LOAD */
window.addEventListener("load", () => {
    openTickets();
});

/* RUN WHEN URL CHANGES */
// remove completely
function goHome(){
    openTickets();
}

function openSubmit(){
    openTickets();
}

function renderFiles(){
fileList.innerHTML = "";

selectedFiles.forEach((file, index) => {

let sizeKB = (file.size / 1024).toFixed(1);

let div = document.createElement("div");
div.className = "file-item";

div.innerHTML = `
<span class="remove-file" onclick="removeFile(${index})">✖</span>
${file.name} (${sizeKB} kb)
`;

fileList.appendChild(div);

});
}

function removeFile(index){
selectedFiles.splice(index,1);
renderFiles();
}
function toggleMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}

function toggleProfilePopup(){
    const popup = document.getElementById("profilePopup");
    popup.style.display = popup.style.display === "block" ? "none" : "block";
}

function goProfile(){
    window.location.href = "profile.html";
}

/* CLOSE POPUP ON OUTSIDE CLICK */
window.addEventListener("click", function(e){

    const popup = document.getElementById("profilePopup");
    const profile = document.querySelector(".profile-panel");

    if(profile && !profile.contains(e.target)){
        popup.style.display = "none";
    }

});


function navigate(path){
    window.location.hash = path;

    // close menu automatically
    document.getElementById("mobileMenu").classList.remove("active");

    handleRoute(); // update UI
}
function setActiveMenu(path){

document.querySelectorAll(".menu-item").forEach(item=>{
    item.classList.remove("active");
});

if(path === "home"){
document.querySelectorAll(".menu-item")[0].classList.add("active");
}
else if(path === "tickets"){
document.querySelectorAll(".menu-item")[1].classList.add("active");
}
else if(path === "tickets/new"){
document.querySelectorAll(".menu-item")[2].classList.add("active");
}
}
</script>
